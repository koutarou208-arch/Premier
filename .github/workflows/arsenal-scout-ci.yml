name: Arsenal Scout CI

on:
  push:
    paths:
      - "arsenal-scout/**"
      - ".github/workflows/arsenal-scout-ci.yml"
  pull_request:
    paths:
      - "arsenal-scout/**"
      - ".github/workflows/arsenal-scout-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arsenal-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src
