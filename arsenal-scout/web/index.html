<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#212121">
  <meta name="description" content="試合データとクラブ財政から補強候補を比較する対話型スカウティングデモ">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23212121'/%3E%3Cpath d='M32 10 52 52H42l-4-9H26l-4 9H12L32 10Zm0 14-4 11h8L32 24Z' fill='%23ef4444'/%3E%3C/svg%3E">
  <title>Arsenal Scout</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/chat.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="メニュー">
      <div class="sidebar-top">
        <button class="new-chat" id="newChat" type="button"><span>＋</span> 新しい分析</button>
        <button class="sidebar-close" id="sidebarClose" type="button" aria-label="メニューを閉じる">×</button>
      </div>
      <nav class="side-nav" aria-label="分析メニュー">
        <p>分析ツール</p>
        <button class="side-item active" data-action="scout" type="button"><span>A</span>補強候補を探す</button>
        <button class="side-item" data-action="finance" type="button"><span>€</span>クラブ財政を確認</button>
        <button class="side-item" data-action="weakness" type="button"><span>↗</span>チームの弱点を確認</button>
        <button class="side-item" data-action="evidence" type="button"><span>◇</span>推薦の根拠を確認</button>
        <button class="side-item" data-action="system" type="button"><span>⌘</span>分析の仕組みを見る</button>
      </nav>
      <section class="history" aria-labelledby="historyTitle">
        <p id="historyTitle">質問例</p>
        <button type="button" data-command="財政負担を抑えながら、ローブロックを崩せる右WGをランキング">財政に無理のない右WG</button>
        <button type="button" data-command="25歳以下で、稼働率の高い即戦力の6番をランキング">即戦力として使える6番</button>
        <button type="button" data-command="ライスと共存できる8番を、費用対効果も含めてランキング">ライスと共存できる8番</button>
      </section>
      <div class="sidebar-note"><strong>デモ環境</strong><span>試合、選手、移籍金、年俸、クラブ財政はすべて架空です。</span></div>
    </aside>

    <button class="sidebar-overlay" id="sidebarOverlay" type="button" aria-label="メニューを閉じる"></button>

    <section class="workspace">
      <header class="topbar">
        <button class="menu-button" id="menuButton" type="button" aria-label="メニューを開く">☰</button>
        <button class="model-button" type="button" aria-label="現在の分析モデル">Arsenal Scout <span>Demo</span></button>
        <div class="finance-state"><i></i><span id="healthText">分析エンジンに接続中</span></div>
      </header>
      <main class="conversation" id="conversation" aria-live="polite"><div class="loading-message">分析画面を準備しています…</div></main>
      <footer class="composer-area">
        <form class="composer" id="chatForm">
          <textarea id="chatInput" rows="1" aria-label="スカウト条件を入力" placeholder="補強条件を日本語で入力してください"></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="送信">↑</button>
        </form>
        <p>回答には架空のデモデータを使用しています。実際の獲得判断には使えません。</p>
      </footer>
    </section>
  </div>

  <dialog id="candidateDialog"><button class="dialog-close" type="button" aria-label="閉じる">×</button><div id="candidateDetail"></div></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
